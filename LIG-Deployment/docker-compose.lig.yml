x-lig-logging: &lig-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  ragflow-cpu:
    env_file:
      - ${RAGFLOW_UPSTREAM_ENV_FILE:?Set RAGFLOW_UPSTREAM_ENV_FILE}
      - ${LIG_ENV_FILE:?Set LIG_ENV_FILE}
    environment:
      RAGFLOW_MCP_HOST_API_KEY: ${RAGFLOW_MCP_API_KEY:?Set RAGFLOW_MCP_API_KEY in LIG-Deployment/.env.secret}
    volumes:
      - ${LIG_LOG_DIRECTORY:?Set LIG_LOG_DIRECTORY}:/ragflow/logs
    mem_limit: 5g
    logging: *lig-logging
    command:
      - --enable-adminserver
      - --init-model-provider-tables
      - --enable-mcpserver
      - --mcp-host=0.0.0.0
      - --mcp-port=9382
      - --mcp-base-url=http://127.0.0.1:9380
      - --mcp-script-path=/ragflow/mcp/server/server.py
      - --mcp-mode=self-host

  ragflow-mcp-lig:
    image: ${RAGFLOW_MCP_LIG_IMAGE:?Set RAGFLOW_MCP_LIG_IMAGE in LIG-Deployment/.env.lig}
    depends_on:
      ragflow-cpu:
        condition: service_started
    environment:
      RAGFLOW_BASE_URL: http://ragflow-cpu:9380
      RAGFLOW_API_KEY: ${RAGFLOW_MCP_API_KEY:?Set RAGFLOW_MCP_API_KEY in LIG-Deployment/.env.secret}
      RAGFLOW_WRITES_ENABLED: "true"
      RAGFLOW_FILE_WRITES_ENABLED: "false"
      RAGFLOW_MAX_TEXT_RESPONSE_MB: "4"
      LIG_MCP_API_KEY: ${RAGFLOW_MCP_API_KEY:?Set RAGFLOW_MCP_API_KEY in LIG-Deployment/.env.secret}
      ASPNETCORE_URLS: http://0.0.0.0:8080
    ports:
      - ${RAGFLOW_MCP_LIG_PORT:?Set RAGFLOW_MCP_LIG_PORT in LIG-Deployment/.env.lig}:8080
    volumes:
      - ${LIG_MCP_DATA_DIRECTORY:?Set LIG_MCP_DATA_DIRECTORY in LIG-Deployment/.env.lig}:/data
    networks:
      - ragflow
    restart: unless-stopped
    mem_limit: 256m
    logging: *lig-logging

  infinity:
    env_file:
      - ${RAGFLOW_UPSTREAM_ENV_FILE:?Set RAGFLOW_UPSTREAM_ENV_FILE}
      - ${LIG_ENV_FILE:?Set LIG_ENV_FILE}
    mem_limit: 1536m
    logging: *lig-logging

  mysql:
    env_file:
      - ${RAGFLOW_UPSTREAM_ENV_FILE:?Set RAGFLOW_UPSTREAM_ENV_FILE}
      - ${LIG_ENV_FILE:?Set LIG_ENV_FILE}
    mem_limit: 1g
    logging: *lig-logging

  minio:
    env_file:
      - ${RAGFLOW_UPSTREAM_ENV_FILE:?Set RAGFLOW_UPSTREAM_ENV_FILE}
      - ${LIG_ENV_FILE:?Set LIG_ENV_FILE}
    mem_limit: 512m
    logging: *lig-logging

  redis:
    env_file:
      - ${RAGFLOW_UPSTREAM_ENV_FILE:?Set RAGFLOW_UPSTREAM_ENV_FILE}
      - ${LIG_ENV_FILE:?Set LIG_ENV_FILE}
    mem_limit: 192m
    logging: *lig-logging

  ollama:
    profiles:
      - ollama
    image: ${OLLAMA_IMAGE}
    ports:
      - ${OLLAMA_PORT}:11434
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: 10m
    networks:
      - ragflow
    restart: unless-stopped
    mem_limit: 3g
    logging: *lig-logging

volumes:
  ollama_data:
    driver: local
