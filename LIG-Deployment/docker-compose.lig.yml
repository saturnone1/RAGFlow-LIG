x-lig-logging: &lig-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  ragflow-migrate:
    image: ${RAGFLOW_IMAGE:?Set RAGFLOW_IMAGE in LIG-Deployment/.env.lig}
    entrypoint: ["/ragflow/.venv/bin/python", "-m", "lig_runtime.container_entrypoint"]
    env_file:
      - ${RAGFLOW_UPSTREAM_ENV_FILE:?Set RAGFLOW_UPSTREAM_ENV_FILE}
      - ${LIG_ENV_FILE:?Set LIG_ENV_FILE}
    environment:
      LIG_LEGACY_MCP_API_KEY: ${RAGFLOW_MCP_API_KEY:-}
    volumes:
      - ./service_conf.yaml.template:/ragflow/conf/service_conf.yaml.template:ro
    command:
      - --migrate-only
      - --init-model-provider-tables
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - ragflow
    restart: "no"
    logging: *lig-logging

  ragflow-cpu:
    image: ${RAGFLOW_IMAGE:?Set RAGFLOW_IMAGE in LIG-Deployment/.env.lig}
    entrypoint: ["/ragflow/.venv/bin/python", "-m", "lig_runtime.container_entrypoint"]
    env_file:
      - ${RAGFLOW_UPSTREAM_ENV_FILE:?Set RAGFLOW_UPSTREAM_ENV_FILE}
      - ${LIG_ENV_FILE:?Set LIG_ENV_FILE}
    environment:
      LIG_DOCUMENT_PASSWORD_KEY: ${LIG_DOCUMENT_PASSWORD_KEY:?Set LIG_DOCUMENT_PASSWORD_KEY in LIG-Deployment/.env.secret}
      LIG_DOCUMENT_PASSWORD_KEY_ID: ${LIG_DOCUMENT_PASSWORD_KEY_ID:-primary}
      LIG_DOCUMENT_PASSWORD_PREVIOUS_KEYS: ${LIG_DOCUMENT_PASSWORD_PREVIOUS_KEYS:-}
      PADDLEOCR_BASE_URL: http://paddleocr:8080
      PADDLEOCR_ACCESS_TOKEN: ${PADDLEOCR_INTERNAL_TOKEN:?Set PADDLEOCR_INTERNAL_TOKEN in LIG-Deployment/.env.secret}
      PADDLEOCR_ALGORITHM: PP-OCRv5
      PADDLEOCR_VL_BASE_URL: http://paddleocr-vl:8080
      PADDLEOCR_VL_ACCESS_TOKEN: ${PADDLEOCR_VL_INTERNAL_TOKEN:?Set PADDLEOCR_VL_INTERNAL_TOKEN in LIG-Deployment/.env.secret}
      TASK_EXECUTOR_WORKERS: ${TASK_EXECUTOR_WORKERS:-3}
    volumes: !override
      - ${LIG_LOG_DIRECTORY:?Set LIG_LOG_DIRECTORY}:/ragflow/logs
      - ./service_conf.yaml.template:/ragflow/conf/service_conf.yaml.template:ro
    logging: *lig-logging
    networks:
      ragflow:
        aliases:
          - ragflow-runtime
    command:
      - --enable-adminserver
      - --skip-database-initialization
      - --enable-mcpserver
      - --mcp-host=0.0.0.0
      - --mcp-port=9382
      - --mcp-base-url=http://127.0.0.1:9380
      - --mcp-script-path=/ragflow/mcp/server/server.py
      - --mcp-mode=host
      - --disable-taskexecutor
      - --workers=${TASK_EXECUTOR_WORKERS:-3}
    depends_on:
      ragflow-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/ragflow/.venv/bin/python", "-m", "lig_runtime.service_health"]
      interval: 15s
      timeout: 12s
      start_period: 60s
      retries: 10

  ragflow-gpu:
    image: ${RAGFLOW_GPU_IMAGE:?Set RAGFLOW_GPU_IMAGE in LIG-Deployment/.env.lig}
    entrypoint: ["/ragflow/.venv/bin/python", "-m", "lig_runtime.container_entrypoint"]
    env_file:
      - ${RAGFLOW_UPSTREAM_ENV_FILE:?Set RAGFLOW_UPSTREAM_ENV_FILE}
      - ${LIG_ENV_FILE:?Set LIG_ENV_FILE}
    environment:
      LIG_DOCUMENT_PASSWORD_KEY: ${LIG_DOCUMENT_PASSWORD_KEY:?Set LIG_DOCUMENT_PASSWORD_KEY in LIG-Deployment/.env.secret}
      LIG_DOCUMENT_PASSWORD_KEY_ID: ${LIG_DOCUMENT_PASSWORD_KEY_ID:-primary}
      LIG_DOCUMENT_PASSWORD_PREVIOUS_KEYS: ${LIG_DOCUMENT_PASSWORD_PREVIOUS_KEYS:-}
      PADDLEOCR_BASE_URL: http://paddleocr:8080
      PADDLEOCR_ACCESS_TOKEN: ${PADDLEOCR_INTERNAL_TOKEN:?Set PADDLEOCR_INTERNAL_TOKEN in LIG-Deployment/.env.secret}
      PADDLEOCR_ALGORITHM: PP-OCRv5
      PADDLEOCR_VL_BASE_URL: http://paddleocr-vl:8080
      PADDLEOCR_VL_ACCESS_TOKEN: ${PADDLEOCR_VL_INTERNAL_TOKEN:?Set PADDLEOCR_VL_INTERNAL_TOKEN in LIG-Deployment/.env.secret}
      TASK_EXECUTOR_WORKERS: ${TASK_EXECUTOR_WORKERS:-3}
    volumes: !override
      - ${LIG_LOG_DIRECTORY:?Set LIG_LOG_DIRECTORY}:/ragflow/logs
      - ./service_conf.yaml.template:/ragflow/conf/service_conf.yaml.template:ro
    logging: *lig-logging
    networks:
      ragflow:
        aliases:
          - ragflow-runtime
    ports:
      - ${GO_HTTP_PORT:?Set GO_HTTP_PORT in LIG-Deployment/.env.lig}:9384
      - ${GO_ADMIN_PORT:?Set GO_ADMIN_PORT in LIG-Deployment/.env.lig}:9383
    command:
      - --enable-adminserver
      - --skip-database-initialization
      - --enable-mcpserver
      - --mcp-host=0.0.0.0
      - --mcp-port=9382
      - --mcp-base-url=http://127.0.0.1:9380
      - --mcp-script-path=/ragflow/mcp/server/server.py
      - --mcp-mode=host
      - --disable-taskexecutor
      - --workers=${TASK_EXECUTOR_WORKERS:-3}
    depends_on:
      ragflow-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/ragflow/.venv/bin/python", "-m", "lig_runtime.service_health"]
      interval: 15s
      timeout: 12s
      start_period: 60s
      retries: 10

  ragflow-worker-cpu:
    profiles:
      - cpu
    image: ${RAGFLOW_IMAGE:?Set RAGFLOW_IMAGE in LIG-Deployment/.env.lig}
    entrypoint: ["/ragflow/.venv/bin/python", "-m", "lig_runtime.container_entrypoint"]
    env_file:
      - ${RAGFLOW_UPSTREAM_ENV_FILE:?Set RAGFLOW_UPSTREAM_ENV_FILE}
      - ${LIG_ENV_FILE:?Set LIG_ENV_FILE}
    environment:
      LIG_DOCUMENT_PASSWORD_KEY: ${LIG_DOCUMENT_PASSWORD_KEY:?Set LIG_DOCUMENT_PASSWORD_KEY in LIG-Deployment/.env.secret}
      LIG_DOCUMENT_PASSWORD_KEY_ID: ${LIG_DOCUMENT_PASSWORD_KEY_ID:-primary}
      LIG_DOCUMENT_PASSWORD_PREVIOUS_KEYS: ${LIG_DOCUMENT_PASSWORD_PREVIOUS_KEYS:-}
      PADDLEOCR_BASE_URL: http://paddleocr:8080
      PADDLEOCR_ACCESS_TOKEN: ${PADDLEOCR_INTERNAL_TOKEN:?Set PADDLEOCR_INTERNAL_TOKEN in LIG-Deployment/.env.secret}
      PADDLEOCR_ALGORITHM: PP-OCRv5
      PADDLEOCR_VL_BASE_URL: http://paddleocr-vl:8080
      PADDLEOCR_VL_ACCESS_TOKEN: ${PADDLEOCR_VL_INTERNAL_TOKEN:?Set PADDLEOCR_VL_INTERNAL_TOKEN in LIG-Deployment/.env.secret}
      TASK_EXECUTOR_WORKERS: ${TASK_EXECUTOR_WORKERS:-3}
      MAX_CONCURRENT_TASKS: ${MAX_CONCURRENT_TASKS:-1}
      MAX_CONCURRENT_CHUNK_BUILDERS: ${MAX_CONCURRENT_CHUNK_BUILDERS:-1}
      TASK_LEASE_SECONDS: ${TASK_LEASE_SECONDS:-180}
      TASK_MAX_CRASH_RETRIES: ${TASK_MAX_CRASH_RETRIES:-0}
      TASK_CANCEL_GRACE_SECONDS: ${TASK_CANCEL_GRACE_SECONDS:-5}
      TASK_CANCEL_POLL_SECONDS: ${TASK_CANCEL_POLL_SECONDS:-1}
      TASK_PENDING_CLAIM_IDLE_SECONDS: ${TASK_PENDING_CLAIM_IDLE_SECONDS:-300}
    volumes:
      - ${LIG_LOG_DIRECTORY:?Set LIG_LOG_DIRECTORY}:/ragflow/logs
    networks:
      - ragflow
    command:
      - --disable-webserver
      - --disable-datasync
      - --skip-database-initialization
      - --workers=${TASK_EXECUTOR_WORKERS:-3}
      - --host-id=lig-cpu-worker
    depends_on:
      ragflow-migrate:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      infinity:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/ragflow/.venv/bin/python", "-m", "lig_runtime.worker_health"]
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 10
    logging: *lig-logging

  ragflow-worker-gpu:
    profiles:
      - gpu
    image: ${RAGFLOW_GPU_IMAGE:?Set RAGFLOW_GPU_IMAGE in LIG-Deployment/.env.lig}
    entrypoint: ["/ragflow/.venv/bin/python", "-m", "lig_runtime.container_entrypoint"]
    env_file:
      - ${RAGFLOW_UPSTREAM_ENV_FILE:?Set RAGFLOW_UPSTREAM_ENV_FILE}
      - ${LIG_ENV_FILE:?Set LIG_ENV_FILE}
    environment:
      LIG_DOCUMENT_PASSWORD_KEY: ${LIG_DOCUMENT_PASSWORD_KEY:?Set LIG_DOCUMENT_PASSWORD_KEY in LIG-Deployment/.env.secret}
      LIG_DOCUMENT_PASSWORD_KEY_ID: ${LIG_DOCUMENT_PASSWORD_KEY_ID:-primary}
      LIG_DOCUMENT_PASSWORD_PREVIOUS_KEYS: ${LIG_DOCUMENT_PASSWORD_PREVIOUS_KEYS:-}
      PADDLEOCR_BASE_URL: http://paddleocr:8080
      PADDLEOCR_ACCESS_TOKEN: ${PADDLEOCR_INTERNAL_TOKEN:?Set PADDLEOCR_INTERNAL_TOKEN in LIG-Deployment/.env.secret}
      PADDLEOCR_ALGORITHM: PP-OCRv5
      PADDLEOCR_VL_BASE_URL: http://paddleocr-vl:8080
      PADDLEOCR_VL_ACCESS_TOKEN: ${PADDLEOCR_VL_INTERNAL_TOKEN:?Set PADDLEOCR_VL_INTERNAL_TOKEN in LIG-Deployment/.env.secret}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      TASK_EXECUTOR_WORKERS: ${TASK_EXECUTOR_WORKERS:-3}
      MAX_CONCURRENT_TASKS: ${MAX_CONCURRENT_TASKS:-1}
      MAX_CONCURRENT_CHUNK_BUILDERS: ${MAX_CONCURRENT_CHUNK_BUILDERS:-1}
      TASK_LEASE_SECONDS: ${TASK_LEASE_SECONDS:-180}
      TASK_MAX_CRASH_RETRIES: ${TASK_MAX_CRASH_RETRIES:-0}
      TASK_CANCEL_GRACE_SECONDS: ${TASK_CANCEL_GRACE_SECONDS:-5}
      TASK_CANCEL_POLL_SECONDS: ${TASK_CANCEL_POLL_SECONDS:-1}
      TASK_PENDING_CLAIM_IDLE_SECONDS: ${TASK_PENDING_CLAIM_IDLE_SECONDS:-300}
    volumes:
      - ${LIG_LOG_DIRECTORY:?Set LIG_LOG_DIRECTORY}:/ragflow/logs
    networks:
      - ragflow
    command:
      - --disable-webserver
      - --disable-datasync
      - --skip-database-initialization
      - --workers=${TASK_EXECUTOR_WORKERS:-3}
      - --host-id=lig-gpu-worker
    depends_on:
      ragflow-migrate:
        condition: service_completed_successfully
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      infinity:
        condition: service_healthy
    restart: unless-stopped
    gpus: all
    healthcheck:
      test: ["CMD", "/ragflow/.venv/bin/python", "-m", "lig_runtime.worker_health"]
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 10
    logging: *lig-logging

  paddleocr-cpu:
    profiles:
      - paddleocr
    image: ${PADDLEOCR_IMAGE:?Set PADDLEOCR_IMAGE in LIG-Deployment/.env.lig}
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - ${RAGFLOW_UPSTREAM_ENV_FILE:?Set RAGFLOW_UPSTREAM_ENV_FILE}
      - ${LIG_ENV_FILE:?Set LIG_ENV_FILE}
    environment:
      PADDLEOCR_DEVICE: cpu
      PADDLEOCR_INTERNAL_TOKEN: ${PADDLEOCR_INTERNAL_TOKEN:?Set PADDLEOCR_INTERNAL_TOKEN in LIG-Deployment/.env.secret}
      PADDLEOCR_VL_BASE_URL: http://paddleocr-vl:8080
      PADDLEOCR_VL_ACCESS_TOKEN: ${PADDLEOCR_VL_INTERNAL_TOKEN:?Set PADDLEOCR_VL_INTERNAL_TOKEN in LIG-Deployment/.env.secret}
      PADDLEOCR_INTERNAL_BASE_URL: http://paddleocr:8080
      PADDLEOCR_JOB_WORKERS: ${PADDLEOCR_JOB_WORKERS:-1}
      PADDLEOCR_MAX_UPLOAD_BYTES: ${PADDLEOCR_MAX_UPLOAD_BYTES:-0}
      PADDLEOCR_MAX_PDF_PAGES: ${PADDLEOCR_MAX_PDF_PAGES:-0}
      PADDLEOCR_MAX_PENDING_JOBS: ${PADDLEOCR_MAX_PENDING_JOBS:-8}
      PADDLEOCR_MIN_FREE_BYTES: ${PADDLEOCR_MIN_FREE_BYTES:-536870912}
      PADDLEOCR_MAX_PAGE_PIXELS: ${PADDLEOCR_MAX_PAGE_PIXELS:-50000000}
      PADDLEOCR_ESTIMATED_BYTES_PER_PIXEL: ${PADDLEOCR_ESTIMATED_BYTES_PER_PIXEL:-48}
      PADDLEOCR_MEMORY_POLL_SECONDS: ${PADDLEOCR_MEMORY_POLL_SECONDS:-2}
    ports:
      - ${PADDLEOCR_PORT:?Set PADDLEOCR_PORT in LIG-Deployment/.env.lig}:8080
    networks:
      ragflow:
        aliases:
          - paddleocr
    restart: unless-stopped
    logging: *lig-logging

  paddleocr-vl-vlm:
    profiles:
      - paddleocr-vl
    image: ${PADDLEOCR_VL_VLM_RUNTIME_IMAGE:?Set PADDLEOCR_VL_VLM_RUNTIME_IMAGE in LIG-Deployment/.env.lig}
    networks:
      ragflow:
        aliases:
          - paddleocr-vlm-server
    restart: unless-stopped
    user: root
    environment:
      PADDLEOCR_VL_GPU_MEMORY_UTILIZATION: ${PADDLEOCR_VL_GPU_MEMORY_UTILIZATION:-0.60}
      PADDLEOCR_VL_MAX_MODEL_LEN: ${PADDLEOCR_VL_MAX_MODEL_LEN:-16384}
      PADDLEOCR_VL_MAX_NUM_BATCHED_TOKENS: ${PADDLEOCR_VL_MAX_NUM_BATCHED_TOKENS:-16384}
      PADDLEOCR_VL_MAX_NUM_SEQS: ${PADDLEOCR_VL_MAX_NUM_SEQS:-8}
      PADDLEOCR_VL_API_SERVER_COUNT: ${PADDLEOCR_VL_API_SERVER_COUNT:-1}
    gpus: all
    shm_size: 64gb
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      start_period: 300s
      retries: 20
    logging: *lig-logging

  paddleocr-vl-api:
    profiles:
      - paddleocr-vl
    image: ${PADDLEOCR_VL_API_IMAGE:?Set PADDLEOCR_VL_API_IMAGE in LIG-Deployment/.env.lig}
    depends_on:
      paddleocr-vl-vlm:
        condition: service_healthy
    environment:
      VLM_BACKEND: vllm
      PADDLEOCR_VL_PIPELINE_DEVICE: ${PADDLEOCR_VL_PIPELINE_DEVICE:-cpu}
    networks:
      - ragflow
    restart: unless-stopped
    user: root
    shm_size: 64gb
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      start_period: 300s
      retries: 20
    logging: *lig-logging

  paddleocr-vl:
    profiles:
      - paddleocr-vl
    image: ${PADDLEOCR_VL_GATEWAY_IMAGE:?Set PADDLEOCR_VL_GATEWAY_IMAGE in LIG-Deployment/.env.lig}
    depends_on:
      paddleocr-vl-api:
        condition: service_healthy
    environment:
      PADDLEOCR_INTERNAL_TOKEN: ${PADDLEOCR_VL_INTERNAL_TOKEN:?Set PADDLEOCR_VL_INTERNAL_TOKEN in LIG-Deployment/.env.secret}
      PADDLEOCR_VL_UPSTREAM_URL: http://paddleocr-vl-api:8080
      PADDLEOCR_VL_INTERNAL_BASE_URL: http://paddleocr-vl:8080
      PADDLEOCR_VL_JOB_WORKERS: ${PADDLEOCR_VL_JOB_WORKERS:-1}
      PADDLEOCR_VL_MAX_UPLOAD_BYTES: ${PADDLEOCR_VL_MAX_UPLOAD_BYTES:-0}
      PADDLEOCR_VL_MAX_PENDING_JOBS: ${PADDLEOCR_VL_MAX_PENDING_JOBS:-8}
      PADDLEOCR_VL_REQUEST_TIMEOUT_SECONDS: ${PADDLEOCR_VL_REQUEST_TIMEOUT_SECONDS:-3600}
    ports:
      - ${PADDLEOCR_VL_PORT:?Set PADDLEOCR_VL_PORT in LIG-Deployment/.env.lig}:8080
    networks:
      ragflow:
        aliases:
          - paddleocr-vl
    restart: unless-stopped
    logging: *lig-logging

  ragflow-mcp-lig:
    image: ${RAGFLOW_MCP_LIG_IMAGE:?Set RAGFLOW_MCP_LIG_IMAGE in LIG-Deployment/.env.lig}
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      RAGFLOW_BASE_URL: http://ragflow-runtime:9380
      RAGFLOW_WRITES_ENABLED: "true"
      RAGFLOW_FILE_WRITES_ENABLED: "false"
      RAGFLOW_MAX_TEXT_RESPONSE_MB: "4"
      ASPNETCORE_URLS: http://0.0.0.0:8080
    ports:
      - ${RAGFLOW_MCP_LIG_PORT:?Set RAGFLOW_MCP_LIG_PORT in LIG-Deployment/.env.lig}:8080
    volumes:
      - ${LIG_MCP_DATA_DIRECTORY:?Set LIG_MCP_DATA_DIRECTORY in LIG-Deployment/.env.lig}:/data
    networks:
      - ragflow
    restart: unless-stopped
    logging: *lig-logging

  infinity:
    env_file:
      - ${RAGFLOW_UPSTREAM_ENV_FILE:?Set RAGFLOW_UPSTREAM_ENV_FILE}
      - ${LIG_ENV_FILE:?Set LIG_ENV_FILE}
    # upstream Compose의 Infinity MEM_LIMIT 상한을 적용하지 않습니다.
    # 자원 크기는 호스트와 Docker 실행 환경에서 관리합니다.
    mem_limit: !reset null
    mem_reservation: !reset null
    cpus: !reset null
    deploy:
      resources:
        limits: !reset null
    # Docker 재시작/종료 때 WAL과 메타데이터를 디스크에 정리할 시간을 줍니다.
    stop_grace_period: 60s
    logging: *lig-logging

  mysql:
    env_file:
      - ${RAGFLOW_UPSTREAM_ENV_FILE:?Set RAGFLOW_UPSTREAM_ENV_FILE}
      - ${LIG_ENV_FILE:?Set LIG_ENV_FILE}
    logging: *lig-logging

  minio:
    env_file:
      - ${RAGFLOW_UPSTREAM_ENV_FILE:?Set RAGFLOW_UPSTREAM_ENV_FILE}
      - ${LIG_ENV_FILE:?Set LIG_ENV_FILE}
    logging: *lig-logging

  redis:
    env_file:
      - ${RAGFLOW_UPSTREAM_ENV_FILE:?Set RAGFLOW_UPSTREAM_ENV_FILE}
      - ${LIG_ENV_FILE:?Set LIG_ENV_FILE}
    # Redis는 캐시가 아니라 문서 작업 큐로 사용됩니다. allkeys-lru를 쓰면
    # 메모리 부족 시 대기 작업이 삭제되고 문서 진행이 멈출 수 있으므로
    # noeviction을 사용합니다. 기본 maxmemory=0은 상한 없음이며, 운영자가
    # REDIS_MAXMEMORY를 명시한 경우에만 그 용량을 적용합니다.
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
      - --maxmemory
      - ${REDIS_MAXMEMORY:-0}
      - --maxmemory-policy
      - noeviction
    logging: *lig-logging

  qwen3-embedding-tei:
    profiles:
      - embedding-cpu
    image: ${QWEN3_EMBEDDING_IMAGE:?Set QWEN3_EMBEDDING_IMAGE in LIG-Deployment/.env.lig}
    command:
      - --model-id
      - /model
      - --served-model-name
      - Qwen/Qwen3-Embedding-0.6B
      - --port
      - "80"
      - --tokenization-workers
      - "2"
      # 8보다 키우면 모든 동시성 구간에서 약 절반으로 느려졌습니다.
      # 같은 호스트에서 텍스트 4개 요청 16회를 4개씩 병렬 실행했을 때
      # 8은 11.36초, 16은 96.95초였으므로 이 값은 유지하십시오.
      - --max-concurrent-requests
      - "8"
      # .env.lig의 MAX_CONCURRENT_EMBEDDERS와 맞추십시오. TEI는 이 개수만큼
      # 요청이 모이기를 기다렸다가 처리하므로, 더 적게 보내면 매번 대기합니다.
      - --max-batch-requests
      - "4"
      # 이 값을 키워도 처리량은 늘지 않고 시작 메모리만 커집니다. 12 CPU,
      # 28 GiB VM에서 텍스트 4개 요청 16회를 4개씩 병렬 실행한 측정값입니다.
      #   2048 ->  3.3 GB / 11.22s     4096 -> 5.8 GB / 11.37s
      #   8192 -> 15.3 GB / 12.59s     32768 -> over 20 GB, engine unresponsive
      # 속도 향상은 큰 단일 forward batch가 아니라 동시 요청에서 나오므로
      # 처리량은 비슷하고 가장 큰 값이 오히려 느립니다. 정상 상태 메모리는
      # 약 2.35 GB로 같고 시작 순간의 최대 사용량만 달라집니다.
      - --max-batch-tokens
      - "2048"
      - --auto-truncate
      - --json-output
    networks:
      - ragflow
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:80/health"]
      interval: 15s
      timeout: 5s
      start_period: 120s
      retries: 20
    logging: *lig-logging

  qwen3-embedding:
    profiles:
      - embedding-cpu
    image: ${QWEN3_EMBEDDING_ADAPTER_IMAGE:?Set QWEN3_EMBEDDING_ADAPTER_IMAGE in LIG-Deployment/.env.lig}
    depends_on:
      qwen3-embedding-tei:
        condition: service_healthy
    environment:
      EMBEDDING_UPSTREAM_URL: http://qwen3-embedding-tei:80
      EMBEDDING_ADAPTER_PORT: "8080"
      EMBEDDING_UPSTREAM_TIMEOUT_SECONDS: ${EMBEDDING_UPSTREAM_TIMEOUT_SECONDS:-300}
      EMBEDDING_MAX_CONCURRENT_REQUESTS: ${EMBEDDING_MAX_CONCURRENT_REQUESTS:-1}
      EMBEDDING_QUERY_INSTRUCTION: ${QWEN3_QUERY_INSTRUCTION:-Given a user question, retrieve relevant passages from internal company documents that answer the question}
    ports:
      - ${QWEN3_EMBEDDING_PORT:?Set QWEN3_EMBEDDING_PORT in LIG-Deployment/.env.lig}:8080
    networks:
      ragflow:
        aliases:
          - qwen3-embedding
    restart: unless-stopped
    logging: *lig-logging
