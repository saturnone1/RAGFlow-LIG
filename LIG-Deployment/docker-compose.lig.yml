x-lig-logging: &lig-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  ragflow-cpu:
    image: ${RAGFLOW_IMAGE:?Set RAGFLOW_IMAGE in LIG-Deployment/.env.lig}
    env_file:
      - ${RAGFLOW_UPSTREAM_ENV_FILE:?Set RAGFLOW_UPSTREAM_ENV_FILE}
      - ${LIG_ENV_FILE:?Set LIG_ENV_FILE}
    environment:
      RAGFLOW_MCP_HOST_API_KEY: ${RAGFLOW_MCP_API_KEY:?Set RAGFLOW_MCP_API_KEY in LIG-Deployment/.env.secret}
      LIG_DOCUMENT_PASSWORD_KEY: ${LIG_DOCUMENT_PASSWORD_KEY:?Set LIG_DOCUMENT_PASSWORD_KEY in LIG-Deployment/.env.secret}
      LIG_DOCUMENT_PASSWORD_KEY_ID: ${LIG_DOCUMENT_PASSWORD_KEY_ID:-primary}
      LIG_DOCUMENT_PASSWORD_PREVIOUS_KEYS: ${LIG_DOCUMENT_PASSWORD_PREVIOUS_KEYS:-}
      PADDLEOCR_BASE_URL: http://paddleocr:8080
      PADDLEOCR_ACCESS_TOKEN: ${PADDLEOCR_INTERNAL_TOKEN:?Set PADDLEOCR_INTERNAL_TOKEN in LIG-Deployment/.env.secret}
      PADDLEOCR_ALGORITHM: PP-OCRv5
    volumes:
      - ${LIG_LOG_DIRECTORY:?Set LIG_LOG_DIRECTORY}:/ragflow/logs
    logging: *lig-logging
    networks:
      ragflow:
        aliases:
          - ragflow-runtime
    command:
      - --enable-adminserver
      - --init-model-provider-tables
      - --enable-mcpserver
      - --mcp-host=0.0.0.0
      - --mcp-port=9382
      - --mcp-base-url=http://127.0.0.1:9380
      - --mcp-script-path=/ragflow/mcp/server/server.py
      - --mcp-mode=self-host
      - --disable-taskexecutor
      - --workers=${TASK_EXECUTOR_WORKERS:-1}
    depends_on:
      paddleocr-cpu:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/ragflow/.venv/bin/python", "-m", "lig_runtime.service_health"]
      interval: 15s
      timeout: 12s
      start_period: 60s
      retries: 10

  ragflow-gpu:
    image: ${RAGFLOW_GPU_IMAGE:?Set RAGFLOW_GPU_IMAGE in LIG-Deployment/.env.lig}
    env_file:
      - ${RAGFLOW_UPSTREAM_ENV_FILE:?Set RAGFLOW_UPSTREAM_ENV_FILE}
      - ${LIG_ENV_FILE:?Set LIG_ENV_FILE}
    environment:
      RAGFLOW_MCP_HOST_API_KEY: ${RAGFLOW_MCP_API_KEY:?Set RAGFLOW_MCP_API_KEY in LIG-Deployment/.env.secret}
      LIG_DOCUMENT_PASSWORD_KEY: ${LIG_DOCUMENT_PASSWORD_KEY:?Set LIG_DOCUMENT_PASSWORD_KEY in LIG-Deployment/.env.secret}
      LIG_DOCUMENT_PASSWORD_KEY_ID: ${LIG_DOCUMENT_PASSWORD_KEY_ID:-primary}
      LIG_DOCUMENT_PASSWORD_PREVIOUS_KEYS: ${LIG_DOCUMENT_PASSWORD_PREVIOUS_KEYS:-}
      PADDLEOCR_BASE_URL: http://paddleocr:8080
      PADDLEOCR_ACCESS_TOKEN: ${PADDLEOCR_INTERNAL_TOKEN:?Set PADDLEOCR_INTERNAL_TOKEN in LIG-Deployment/.env.secret}
      PADDLEOCR_ALGORITHM: PP-OCRv5
    volumes:
      - ${LIG_LOG_DIRECTORY:?Set LIG_LOG_DIRECTORY}:/ragflow/logs
    logging: *lig-logging
    networks:
      ragflow:
        aliases:
          - ragflow-runtime
    ports:
      - ${GO_HTTP_PORT:?Set GO_HTTP_PORT in LIG-Deployment/.env.lig}:9384
      - ${GO_ADMIN_PORT:?Set GO_ADMIN_PORT in LIG-Deployment/.env.lig}:9383
    command:
      - --enable-adminserver
      - --init-model-provider-tables
      - --enable-mcpserver
      - --mcp-host=0.0.0.0
      - --mcp-port=9382
      - --mcp-base-url=http://127.0.0.1:9380
      - --mcp-script-path=/ragflow/mcp/server/server.py
      - --mcp-mode=self-host
      - --disable-taskexecutor
      - --workers=${TASK_EXECUTOR_WORKERS:-1}
    depends_on:
      paddleocr-gpu:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/ragflow/.venv/bin/python", "-m", "lig_runtime.service_health"]
      interval: 15s
      timeout: 12s
      start_period: 60s
      retries: 10

  ragflow-worker-cpu:
    profiles:
      - cpu
    image: ${RAGFLOW_IMAGE:?Set RAGFLOW_IMAGE in LIG-Deployment/.env.lig}
    env_file:
      - ${RAGFLOW_UPSTREAM_ENV_FILE:?Set RAGFLOW_UPSTREAM_ENV_FILE}
      - ${LIG_ENV_FILE:?Set LIG_ENV_FILE}
    environment:
      LIG_DOCUMENT_PASSWORD_KEY: ${LIG_DOCUMENT_PASSWORD_KEY:?Set LIG_DOCUMENT_PASSWORD_KEY in LIG-Deployment/.env.secret}
      LIG_DOCUMENT_PASSWORD_KEY_ID: ${LIG_DOCUMENT_PASSWORD_KEY_ID:-primary}
      LIG_DOCUMENT_PASSWORD_PREVIOUS_KEYS: ${LIG_DOCUMENT_PASSWORD_PREVIOUS_KEYS:-}
      PADDLEOCR_BASE_URL: http://paddleocr:8080
      PADDLEOCR_ACCESS_TOKEN: ${PADDLEOCR_INTERNAL_TOKEN:?Set PADDLEOCR_INTERNAL_TOKEN in LIG-Deployment/.env.secret}
      PADDLEOCR_ALGORITHM: PP-OCRv5
      MAX_CONCURRENT_TASKS: ${MAX_CONCURRENT_TASKS:-1}
      MAX_CONCURRENT_CHUNK_BUILDERS: ${MAX_CONCURRENT_CHUNK_BUILDERS:-1}
      TASK_LEASE_SECONDS: ${TASK_LEASE_SECONDS:-180}
      TASK_MAX_CRASH_RETRIES: ${TASK_MAX_CRASH_RETRIES:-0}
    volumes:
      - ${LIG_LOG_DIRECTORY:?Set LIG_LOG_DIRECTORY}:/ragflow/logs
    networks:
      - ragflow
    command:
      - --disable-webserver
      - --disable-datasync
      - --workers=${TASK_EXECUTOR_WORKERS:-1}
      - --host-id=lig-cpu-worker
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      infinity:
        condition: service_healthy
      paddleocr-cpu:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'rag/svr/task_executor.py' >/dev/null"]
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 10
    logging: *lig-logging

  ragflow-worker-gpu:
    profiles:
      - gpu
    image: ${RAGFLOW_GPU_IMAGE:?Set RAGFLOW_GPU_IMAGE in LIG-Deployment/.env.lig}
    env_file:
      - ${RAGFLOW_UPSTREAM_ENV_FILE:?Set RAGFLOW_UPSTREAM_ENV_FILE}
      - ${LIG_ENV_FILE:?Set LIG_ENV_FILE}
    environment:
      LIG_DOCUMENT_PASSWORD_KEY: ${LIG_DOCUMENT_PASSWORD_KEY:?Set LIG_DOCUMENT_PASSWORD_KEY in LIG-Deployment/.env.secret}
      LIG_DOCUMENT_PASSWORD_KEY_ID: ${LIG_DOCUMENT_PASSWORD_KEY_ID:-primary}
      LIG_DOCUMENT_PASSWORD_PREVIOUS_KEYS: ${LIG_DOCUMENT_PASSWORD_PREVIOUS_KEYS:-}
      PADDLEOCR_BASE_URL: http://paddleocr:8080
      PADDLEOCR_ACCESS_TOKEN: ${PADDLEOCR_INTERNAL_TOKEN:?Set PADDLEOCR_INTERNAL_TOKEN in LIG-Deployment/.env.secret}
      PADDLEOCR_ALGORITHM: PP-OCRv5
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      MAX_CONCURRENT_TASKS: ${MAX_CONCURRENT_TASKS:-1}
      MAX_CONCURRENT_CHUNK_BUILDERS: ${MAX_CONCURRENT_CHUNK_BUILDERS:-1}
      TASK_LEASE_SECONDS: ${TASK_LEASE_SECONDS:-180}
      TASK_MAX_CRASH_RETRIES: ${TASK_MAX_CRASH_RETRIES:-0}
    volumes:
      - ${LIG_LOG_DIRECTORY:?Set LIG_LOG_DIRECTORY}:/ragflow/logs
    networks:
      - ragflow
    command:
      - --disable-webserver
      - --disable-datasync
      - --workers=${TASK_EXECUTOR_WORKERS:-1}
      - --host-id=lig-gpu-worker
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      infinity:
        condition: service_healthy
      paddleocr-gpu:
        condition: service_healthy
    restart: unless-stopped
    gpus: all
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'rag/svr/task_executor.py' >/dev/null"]
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 10
    logging: *lig-logging

  paddleocr-cpu:
    profiles:
      - cpu
    image: ${PADDLEOCR_IMAGE:?Set PADDLEOCR_IMAGE in LIG-Deployment/.env.lig}
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - ${RAGFLOW_UPSTREAM_ENV_FILE:?Set RAGFLOW_UPSTREAM_ENV_FILE}
      - ${LIG_ENV_FILE:?Set LIG_ENV_FILE}
    environment:
      PADDLEOCR_DEVICE: cpu
      PADDLEOCR_INTERNAL_TOKEN: ${PADDLEOCR_INTERNAL_TOKEN:?Set PADDLEOCR_INTERNAL_TOKEN in LIG-Deployment/.env.secret}
      PADDLEOCR_INTERNAL_BASE_URL: http://paddleocr:8080
      PADDLEOCR_JOB_WORKERS: ${PADDLEOCR_JOB_WORKERS:-1}
      PADDLEOCR_MAX_UPLOAD_BYTES: ${PADDLEOCR_MAX_UPLOAD_BYTES:-0}
      PADDLEOCR_MAX_PDF_PAGES: ${PADDLEOCR_MAX_PDF_PAGES:-0}
      PADDLEOCR_MAX_PENDING_JOBS: ${PADDLEOCR_MAX_PENDING_JOBS:-8}
      PADDLEOCR_MIN_FREE_BYTES: ${PADDLEOCR_MIN_FREE_BYTES:-536870912}
      PADDLEOCR_MAX_PAGE_PIXELS: ${PADDLEOCR_MAX_PAGE_PIXELS:-50000000}
      PADDLEOCR_ESTIMATED_BYTES_PER_PIXEL: ${PADDLEOCR_ESTIMATED_BYTES_PER_PIXEL:-48}
      PADDLEOCR_MEMORY_POLL_SECONDS: ${PADDLEOCR_MEMORY_POLL_SECONDS:-2}
    ports:
      - ${PADDLEOCR_PORT:?Set PADDLEOCR_PORT in LIG-Deployment/.env.lig}:8080
    networks:
      ragflow:
        aliases:
          - paddleocr
    restart: unless-stopped
    logging: *lig-logging

  paddleocr-gpu:
    profiles:
      - gpu
    image: ${PADDLEOCR_GPU_IMAGE:?Set PADDLEOCR_GPU_IMAGE in LIG-Deployment/.env.lig}
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - ${RAGFLOW_UPSTREAM_ENV_FILE:?Set RAGFLOW_UPSTREAM_ENV_FILE}
      - ${LIG_ENV_FILE:?Set LIG_ENV_FILE}
    environment:
      PADDLEOCR_DEVICE: gpu
      PADDLEOCR_INTERNAL_TOKEN: ${PADDLEOCR_INTERNAL_TOKEN:?Set PADDLEOCR_INTERNAL_TOKEN in LIG-Deployment/.env.secret}
      PADDLEOCR_INTERNAL_BASE_URL: http://paddleocr:8080
      PADDLEOCR_JOB_WORKERS: ${PADDLEOCR_JOB_WORKERS:-1}
      PADDLEOCR_MAX_UPLOAD_BYTES: ${PADDLEOCR_MAX_UPLOAD_BYTES:-0}
      PADDLEOCR_MAX_PDF_PAGES: ${PADDLEOCR_MAX_PDF_PAGES:-0}
      PADDLEOCR_MAX_PENDING_JOBS: ${PADDLEOCR_MAX_PENDING_JOBS:-8}
      PADDLEOCR_MIN_FREE_BYTES: ${PADDLEOCR_MIN_FREE_BYTES:-536870912}
      PADDLEOCR_MAX_PAGE_PIXELS: ${PADDLEOCR_MAX_PAGE_PIXELS:-50000000}
      PADDLEOCR_ESTIMATED_BYTES_PER_PIXEL: ${PADDLEOCR_ESTIMATED_BYTES_PER_PIXEL:-48}
      PADDLEOCR_MEMORY_POLL_SECONDS: ${PADDLEOCR_MEMORY_POLL_SECONDS:-2}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    ports:
      - ${PADDLEOCR_PORT:?Set PADDLEOCR_PORT in LIG-Deployment/.env.lig}:8080
    networks:
      ragflow:
        aliases:
          - paddleocr
    restart: unless-stopped
    gpus: all
    logging: *lig-logging

  ragflow-mcp-lig:
    image: ${RAGFLOW_MCP_LIG_IMAGE:?Set RAGFLOW_MCP_LIG_IMAGE in LIG-Deployment/.env.lig}
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      RAGFLOW_BASE_URL: http://ragflow-runtime:9380
      RAGFLOW_API_KEY: ${RAGFLOW_MCP_API_KEY:?Set RAGFLOW_MCP_API_KEY in LIG-Deployment/.env.secret}
      RAGFLOW_WRITES_ENABLED: "true"
      RAGFLOW_FILE_WRITES_ENABLED: "false"
      RAGFLOW_MAX_TEXT_RESPONSE_MB: "4"
      LIG_MCP_API_KEY: ${RAGFLOW_MCP_API_KEY:?Set RAGFLOW_MCP_API_KEY in LIG-Deployment/.env.secret}
      ASPNETCORE_URLS: http://0.0.0.0:8080
    ports:
      - ${RAGFLOW_MCP_LIG_PORT:?Set RAGFLOW_MCP_LIG_PORT in LIG-Deployment/.env.lig}:8080
    volumes:
      - ${LIG_MCP_DATA_DIRECTORY:?Set LIG_MCP_DATA_DIRECTORY in LIG-Deployment/.env.lig}:/data
    networks:
      - ragflow
    restart: unless-stopped
    logging: *lig-logging

  infinity:
    env_file:
      - ${RAGFLOW_UPSTREAM_ENV_FILE:?Set RAGFLOW_UPSTREAM_ENV_FILE}
      - ${LIG_ENV_FILE:?Set LIG_ENV_FILE}
    # The upstream Compose applies MEM_LIMIT to Infinity. Resource sizing belongs
    # to the host/Docker runtime in the LIG deployment, so remove that hard cap.
    mem_limit: !reset null
    logging: *lig-logging

  mysql:
    env_file:
      - ${RAGFLOW_UPSTREAM_ENV_FILE:?Set RAGFLOW_UPSTREAM_ENV_FILE}
      - ${LIG_ENV_FILE:?Set LIG_ENV_FILE}
    logging: *lig-logging

  minio:
    env_file:
      - ${RAGFLOW_UPSTREAM_ENV_FILE:?Set RAGFLOW_UPSTREAM_ENV_FILE}
      - ${LIG_ENV_FILE:?Set LIG_ENV_FILE}
    logging: *lig-logging

  redis:
    env_file:
      - ${RAGFLOW_UPSTREAM_ENV_FILE:?Set RAGFLOW_UPSTREAM_ENV_FILE}
      - ${LIG_ENV_FILE:?Set LIG_ENV_FILE}
    logging: *lig-logging

  qwen3-embedding-tei:
    profiles:
      - embedding-cpu
    image: ${QWEN3_EMBEDDING_IMAGE:?Set QWEN3_EMBEDDING_IMAGE in LIG-Deployment/.env.lig}
    command:
      - --model-id
      - /model
      - --served-model-name
      - Qwen/Qwen3-Embedding-0.6B
      - --port
      - "80"
      - --tokenization-workers
      - "2"
      - --max-concurrent-requests
      - "8"
      - --max-batch-requests
      - "4"
      - --max-batch-tokens
      - "2048"
      - --auto-truncate
      - --json-output
    networks:
      - ragflow
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:80/health"]
      interval: 15s
      timeout: 5s
      start_period: 120s
      retries: 20
    logging: *lig-logging

  qwen3-embedding:
    profiles:
      - embedding-cpu
    image: ${QWEN3_EMBEDDING_ADAPTER_IMAGE:?Set QWEN3_EMBEDDING_ADAPTER_IMAGE in LIG-Deployment/.env.lig}
    depends_on:
      qwen3-embedding-tei:
        condition: service_healthy
    environment:
      EMBEDDING_UPSTREAM_URL: http://qwen3-embedding-tei:80
      EMBEDDING_ADAPTER_PORT: "8080"
      EMBEDDING_UPSTREAM_TIMEOUT_SECONDS: ${EMBEDDING_UPSTREAM_TIMEOUT_SECONDS:-300}
      EMBEDDING_MAX_CONCURRENT_REQUESTS: ${EMBEDDING_MAX_CONCURRENT_REQUESTS:-1}
      EMBEDDING_QUERY_INSTRUCTION: ${QWEN3_QUERY_INSTRUCTION:-Given a user question, retrieve relevant passages from internal company documents that answer the question}
    ports:
      - ${QWEN3_EMBEDDING_PORT:?Set QWEN3_EMBEDDING_PORT in LIG-Deployment/.env.lig}:8080
    networks:
      ragflow:
        aliases:
          - qwen3-embedding
    restart: unless-stopped
    logging: *lig-logging
