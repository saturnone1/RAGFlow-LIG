apiVersion: v1
kind: Secret
metadata:
  name: lig-ragflow-secrets
type: Opaque
stringData:
  MYSQL_PASSWORD: replace-with-a-random-password
  MYSQL_ROOT_PASSWORD: replace-with-the-same-random-password
  MINIO_USER: rag_flow
  MINIO_ROOT_USER: rag_flow
  MINIO_PASSWORD: replace-with-a-random-password
  MINIO_ROOT_PASSWORD: replace-with-the-same-random-password
  REDIS_PASSWORD: replace-with-a-random-password
  PADDLEOCR_INTERNAL_TOKEN: replace-with-a-random-internal-token
  PADDLEOCR_VL_INTERNAL_TOKEN: replace-with-a-different-random-internal-token
  LIG_DOCUMENT_PASSWORD_KEY: generate-a-base64-encoded-32-byte-key
  LIG_DOCUMENT_PASSWORD_KEY_ID: primary
  LIG_DOCUMENT_PASSWORD_PREVIOUS_KEYS: ""
